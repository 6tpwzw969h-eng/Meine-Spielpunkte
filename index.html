<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spielpunkte"><meta name="theme-color" content="#183b35"><title>Meine Spielpunkte</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18332e;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}header{background:#183b35;color:white;padding:calc(20px + env(safe-area-inset-top)) 18px 20px}header h1{margin:0;font-size:25px}header small{opacity:.8}main{max-width:660px;margin:auto;padding:16px 14px 60px}.card{background:white;border:1px solid #e0e8e2;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 9px #122b2010}.game{width:100%;text-align:left;padding:19px;display:flex;gap:16px;align-items:center}.emoji{font-size:36px}.muted{color:#667c72;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.row>span:first-child{flex:1}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#e7efea;color:#173e34;font-weight:650}button.primary,.selected{background:#196e55!important;color:white!important}button.danger{color:#a52332;background:#fbe9eb}button:disabled{opacity:.45}input{font:inherit;border:1px solid #cbd9d0;border-radius:9px;padding:10px;min-width:0;width:100%;background:white;color:#172d27}input[type=number]{width:76px;text-align:center;font-variant-numeric:tabular-nums}input[type=checkbox]{width:22px;height:22px;accent-color:#196e55}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{flex:1;min-width:70px}.step{display:flex;gap:5px;align-items:center}.step button{padding:9px 12px}.step input{width:64px}.total{font-size:30px;font-weight:800;color:#196e55}.summary{background:#e9f3ed;border-radius:12px;padding:14px}.section{margin-top:20px;border-top:1px solid #e5eae6;padding-top:14px}h2{font-size:20px;margin:0 0 8px}h3{font-size:17px;margin:8px 0}p{line-height:1.5}.score{font-weight:750}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.notice{font-size:12px;color:#667c72}.pill{font-size:12px;background:#d9eadd;padding:5px 9px;border-radius:30px}button:focus-visible,input:focus-visible{outline:3px solid #f1bd51;outline-offset:2px}.select{width:100%;padding:11px;border:1px solid #cbd9d0;border-radius:9px;background:white;font:inherit}.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.field label{flex:1}.field input{max-width:110px}.hint{font-size:12px;color:#667c72;margin:3px 0 12px}.note{background:#fff5d9;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.group{border-top:1px solid #e0e8e2;padding-top:12px;margin-top:12px}</style></head><body><header><h1>🎲 Meine Spielpunkte</h1><small>Dein Brettspiel-Punktezähler</small></header><main id="app"><section class="card"><h2>Spieleauswahl</h2><p>🌿 Harmonies</p><p>🌸 Ohanami</p><p>🎪 Der Wanderzirkus</p><p class="notice">Wenn diese Anzeige stehen bleibt, blockiert die Dateivorschau JavaScript. Bitte die App über eine richtige Webadresse in Safari öffnen.</p></section></main><script>
const KEY='brettspiel-punktezaehler-v1';
const blank=(game,name)=>game==='harm'?{name,t1:0,t2:0,t3:0,m1:0,m2:0,m3:0,f:0,h:0,river:0,islands:1,animals:[0,0,0,0],cubes:0}:game==='oha'?{name,rounds:Array.from({length:3},()=>({blue:0,green:0,gray:0,pink:0}))}:{name,rounds:Array.from({length:5},()=>({announce:0,cities:0,green:0,blue:0,red:0,purple:0,pause:0})),coins:0};
const fresh=game=>[blank(game,'Spieler 1'),blank(game,'Spieler 2')];
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!['harm','oha','circ'].every(k=>Array.isArray(data[k])))data={harm:fresh('harm'),oha:fresh('oha'),circ:fresh('circ'),side:'A'};
let game='home',who=0,round=0,ranking=false;const app=document.getElementById('app');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Math.max(0,Math.floor(Number(v)||0));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};const player=()=>data[game][who];const hscore=p=>p.t1+3*p.t2+7*p.t3+p.m1+3*p.m2+7*p.m3+5*(p.f+p.h)+(data.side==='A'?(p.river<=1?0:p.river<=5?3*p.river-4:15+4*(p.river-6)):5*Math.max(1,p.islands));const oscore=(p,r)=>{const v=p.rounds[r];return 3*v.blue+(r>=1?4*v.green:0)+(r===2?7*v.gray+v.pink*(v.pink+1)/2:0)};const cscore=r=>r.announce+r.cities+r.green+r.blue+r.red+r.purple-4*r.pause;const score=p=>game==='harm'?hscore(p)+p.animals.reduce((a,b)=>a+b,0):game==='oha'?p.rounds.reduce((s,_,i)=>s+oscore(p,i),0):p.rounds.reduce((s,r)=>s+cscore(r),0)+Math.floor(p.coins/3);
const row=(label,key,sub='',value=player()[key])=>`<div class="row"><span>${label}${sub?`<div class="muted">${sub}</div>`:''}</span><div class="step"><button data-act="dec" data-key="${key}">−</button><input aria-label="${safe(label)}" type="number" min="0" inputmode="numeric" data-key="${key}" value="${value}"><button data-act="inc" data-key="${key}">+</button></div></div>`;
function render(){if(game==='home'){app.innerHTML=`<h2>Wähle dein Spiel</h2>${[['harm','🌿','Harmonies','Landschaften und Tierkarten'],['oha','🌸','Ohanami','Drei Wertungsrunden'],['circ','🎪','Der Wanderzirkus','Fünf Runden und Münzbonus'],['castle','🏰','Castle Combo','9 Karten und Schlüssel'],['dungeon','🏯','Dungeon Designer','Mehrspieler und Solo'],['arnak','🧭','Die verlorenen Ruinen von Arnak','Mit Expeditionsleiter'],['morty','🪄','Morty Sorty Magic Shop','Grundspiel und Wertungsrollen']].sort((a,b)=>a[2].localeCompare(b[2],'de')).map(([id,em,name,desc])=>`<button class="card game" data-game="${id}"><span class="emoji">${em}</span><span><strong>${name}</strong><br><span class="muted">${desc}</span></span><span>›</span></button>`).join('')}<p class="notice">Spielstände werden automatisch in diesem Browser auf diesem Gerät gespeichert. Bei gelöschten Websitedaten können sie verloren gehen.</p>`;return}
const p=player();let html=`<div class="top"><button data-act="home">← Spiele</button><span class="pill">Automatisch gespeichert</span></div><h2>${game==='harm'?'🌿 Harmonies':game==='oha'?'🌸 Ohanami':'🎪 Der Wanderzirkus'}</h2><div class="tabs">${data[game].map((x,i)=>`<button data-who="${i}" class="${i===who?'selected':''}">${safe(x.name)} · ${score(x)}</button>`).join('')}<button data-act="add" ${data[game].length>=(game==='oha'?4:game==='circ'?6:8)?'disabled':''}>＋ Spieler</button></div><div class="card"><div class="row"><span><label for="name">Spielername</label><input id="name" data-name value="${safe(p.name)}"></span><div style="text-align:right"><div class="muted">Gesamtpunkte</div><div class="total">${score(p)}</div></div></div></div>`;
if(game==='harm'){html+=`<div class="card"><h3>Spielplanseite</h3><div class="tabs"><button data-side="A" class="${data.side==='A'?'selected':''}">A · Fluss</button><button data-side="B" class="${data.side==='B'?'selected':''}">B · Inseln</button></div>`;for(const [title,fields,hint] of [['🌳 Bäume',[['t1','Höhe 1',1],['t2','Höhe 2',3],['t3','Höhe 3',7]],''],['⛰️ Berge',[['m1','Höhe 1',1],['m2','Höhe 2',3],['m3','Höhe 3',7]],'Nur Berge mit mindestens einem benachbarten Berg.'],['🌾 Felder',[['f','Gültige Feldgruppen',5]],'Je zusammenhängender Gruppe mit mindestens zwei gelben Steinen.'],['🏠 Gebäude',[['h','Gültige Gebäude',5]],'Gebäude mit mindestens drei benachbarten Farben.']]){html+=`<div class="section"><h3>${title}</h3>${fields.map(([key,label,rate])=>row(label,key,`${rate} Punkte pro Stück`)).join('')}${hint?`<div class="notice">${hint}</div>`:''}</div>`}html+=`<div class="section"><h3>💧 Wasser</h3>${row(data.side==='A'?'Längster gültiger Fluss':'Anzahl Inseln',data.side==='A'?'river':'islands')}</div></div><div class="card"><h3>🐾 Tierkarten / Aufträge</h3>${p.animals.map((v,i)=>`<div class="row"><span>Tierkarte ${i+1}</span><input aria-label="Tierkarte ${i+1} Punkte" type="number" min="0" inputmode="numeric" data-animal="${i}" value="${v}"><button class="danger" data-remove-animal="${i}">✕</button></div>`).join('')}<button data-act="animal">＋ Tierkarte hinzufügen</button></div>`}
if(game==='oha'){html+=`<div class="card"><h3>Wertungsdurchgang</h3><div class="tabs">${[0,1,2].map(i=>`<button data-round="${i}" class="${i===round?'selected':''}">Runde ${i+1}</button>`).join('')}</div><p class="muted">Gesamte Anzahl der ausliegenden Karten je Farbe in dieser Runde eingeben.</p>${[['blue','💧 Blau',3],['green','🌿 Grün',4],['gray','🪨 Grau',7],['pink','🌸 Rosa',0]].filter(([k])=>round===2||(round===1&&['blue','green'].includes(k))||(round===0&&k==='blue')).map(([key,label,rate])=>row(label,key,rate?`${rate} Punkte je Karte`:'Steigende Wertung',p.rounds[round][key])).join('')}<div class="summary row"><span>Runde ${round+1}</span><strong>${oscore(p,round)} Punkte</strong></div></div>`}
if(game==='circ'){html+=`<div class="card"><h3>Wertungsrunde</h3><div class="tabs">${[0,1,2,3,4].map(i=>`<button data-round="${i}" class="${i===round?'selected':''}">${i+1}</button>`).join('')}</div><p class="muted">Selbst ermittelte Punkte eingeben.</p>${[['announce','🎯 Ansage'],['cities','🏙️ Städte'],['green','🟢 Feuertänzer'],['blue','🔵 Magier'],['red','🔴 Clowns'],['purple','🟣 Akrobaten']].map(([key,label])=>row(label,key,'',p.rounds[round][key])).join('')}<label class="row"><span>⏸️ Pause verwendet (−4 Punkte)</span><input type="checkbox" data-pause ${p.rounds[round].pause?'checked':''}></label><div class="summary row"><span>Runde ${round+1}</span><strong>${cscore(p.rounds[round])} Punkte</strong></div></div><div class="card"><h3>🪙 Übrige Münzen</h3>${row('Münzen','coins','Je 3 Münzen = 1 Punkt')}</div>`}
html+=`<div class="card summary"><h3>Punkteübersicht · ${safe(p.name)}</h3>${game==='harm'?`<div class="row"><span>Landschaften</span><strong>${hscore(p)}</strong></div><div class="row"><span>Tierkarten</span><strong>${p.animals.reduce((a,b)=>a+b,0)}</strong></div>`:p.rounds.map((r,i)=>`<div class="row"><span>Runde ${i+1}</span><strong>${game==='oha'?oscore(p,i):cscore(r)}</strong></div>`).join('')+(game==='circ'?`<div class="row"><span>Münzbonus</span><strong>${Math.floor(p.coins/3)}</strong></div>`:'')}<hr><div class="row"><strong>Gesamtpunkte</strong><span class="total">${score(p)}</span></div></div><div class="card"><button data-act="ranking">🏆 ${ranking?'Rangliste ausblenden':'Rangliste anzeigen'}</button>${ranking?`<div class="section">${[...data[game]].sort((a,b)=>score(b)-score(a)||(game==='harm'?b.cubes-a.cubes:game==='circ'?b.coins-a.coins:0)).map((x,i)=>`<div class="row"><span>${i===0?'🏆':i+1+'.'} ${safe(x.name)}</span><strong>${score(x)} Punkte</strong></div>`).join('')}${game==='harm'?'<p class="muted">Bei Gleichstand zählen die platzierten Tierwürfel.</p>'+data.harm.map((x,i)=>`<div class="row"><span>${safe(x.name)} · Tierwürfel</span><input type="number" min="0" inputmode="numeric" data-cubes="${i}" value="${x.cubes}"></div>`).join(''):''}</div>`:''}</div><button class="danger" data-act="reset">↻ Neues Spiel starten</button>`;app.innerHTML=html}
function setField(key,value){const p=player();if(game==='oha'||game==='circ'){p.rounds[round][key]=n(value)}else p[key]=key==='islands'?Math.max(1,n(value)):n(value);save();render()}
app.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.game){game=el.dataset.game;who=0;round=0;ranking=false;render();return}if(el.dataset.who!==undefined){who=+el.dataset.who;render();return}if(el.dataset.round!==undefined){round=+el.dataset.round;render();return}if(el.dataset.side){data.side=el.dataset.side;save();render();return}if(el.dataset.removeAnimal!==undefined){player().animals.splice(+el.dataset.removeAnimal,1);save();render();return}const a=el.dataset.act;if(a==='home'){game='home';render()}else if(a==='add'){data[game].push(blank(game,`Spieler ${data[game].length+1}`));who=data[game].length-1;save();render()}else if(a==='animal'){player().animals.push(0);save();render()}else if(a==='ranking'){ranking=!ranking;render()}else if(a==='reset'){if(confirm('Alle Spielstände für dieses Spiel zurücksetzen?')){data[game]=fresh(game);who=0;round=0;ranking=false;save();render()}}else if(a==='inc'||a==='dec'){const key=el.dataset.key;const v=(game==='oha'||game==='circ'?player().rounds[round][key]:player()[key]);setField(key,v+(a==='inc'?1:-1))}});
app.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-name]')){player().name=el.value.trim()||`Spieler ${who+1}`;save();render()}else if(el.dataset.key){setField(el.dataset.key,el.value)}else if(el.dataset.animal!==undefined){player().animals[+el.dataset.animal]=n(el.value);save();render()}else if(el.dataset.cubes!==undefined){data.harm[+el.dataset.cubes].cubes=n(el.value);save();render()}else if(el.matches('[data-pause]')){player().rounds[round].pause=el.checked?1:0;save();render()}});

// Erweiterungen: eigener Speicherbereich; bestehende drei Spiele bleiben unverändert.
const EXTKEY='brettspiel-punktezaehler-erweiterung-v1';
const extGames=['castle','dungeon','arnak','morty'];
const extTitles={castle:'🏰 Castle Combo',dungeon:'🏯 Dungeon Designer',arnak:'🧭 Die verlorenen Ruinen von Arnak',morty:'🪄 Morty Sorty Magic Shop'};
const defNew=(g,name)=>({name,mode:'multi',variant:'base',v:{},cards:Array(9).fill(0),rolls:['base','base','base','base']});
let ext={};try{ext=JSON.parse(localStorage.getItem(EXTKEY))||{}}catch(e){};
for(const g of extGames)if(!Array.isArray(ext[g]))ext[g]=[defNew(g,'Spieler 1'),defNew(g,'Spieler 2')];
let dungeonMode='multi',mortyVariant='base';
const persistExt=()=>{try{localStorage.setItem(EXTKEY,JSON.stringify(ext))}catch(e){}};
const ep=()=>ext[game][who];
const v=(p,k)=>Number(p.v[k])||0;
const val=(p,k)=>Number(p.v[k])||0;
const normalMorty=n=>[0,1,3,6,10,15,21,28,36,46,60][Math.min(10,Math.max(0,Math.floor(n)))];
function mortyIngredient(p,i){let qty=v(p,'q'+i),r=p.rolls[i]||'base';if(p.variant!=='advanced'||r==='base')return normalMorty(qty);
 if(i===0){if(r==='I')return 3*qty+(v(p,'mushRun')>=3?10:0);return v(p,'mushGroupPoints');}
 if(i===1){if(r==='I')return 4*qty+v(p,'cloudGroupBonus');return 2*qty+v(p,'cloudRowBonus');}
 if(i===2){if(r==='I')return Math.min(v(p,'blackLids'),4)*qty;return Math.min(v(p,'goldLids'),v(p,'silverLids'))*qty;}
 if(i===3){if(r==='I')return v(p,'mandrakeNumberPoints');return 4*qty+v(p,'mandrakeSetBonus');}
 return 0;
}
function newScore(p,g){if(g==='castle')return p.cards.reduce((a,b)=>a+(Number(b)||0),0)+v(p,'keys');
if(g==='arnak')return v(p,'research')+v(p,'deck')+v(p,'temple2')*2+v(p,'temple6')*6+v(p,'temple11')*11+v(p,'guard')*5+v(p,'idol')*3-v(p,'fear');
if(g==='morty')return [0,1,2,3].reduce((a,i)=>a+mortyIngredient(p,i),0)+v(p,'shelves')+v(p,'signs')+v(p,'cats')+v(p,'badges');
return ['rank','goal','task1','task2','task3','starsPlus','starsMinus','blueprint','pathsEntry','pathsExit','other'].reduce((a,k)=>a+(k==='starsMinus'?-1:1)*v(p,k),0);
}
function fld(label,k,info='',negative=false){const p=ep();return `<div class="field"><label>${label}${info?`<div class="muted">${info}</div>`:''}</label><input type="number" ${negative?'':'min="0"'} inputmode="numeric" data-extfield="${k}" value="${v(p,k)}"></div>`}
function titleCard(t,body){return `<section class="card"><h3>${t}</h3>${body}</section>`}
function extRender(){const p=ep();const solo=game==='dungeon'&&dungeonMode==='solo';const max=game==='morty'?4:game==='castle'?6:game==='arnak'?4:6;
let html=`<div class="top"><button data-xact="home">← Spiele</button><span class="pill">Automatisch gespeichert</span></div><h2>${extTitles[game]}</h2>`;
if(game==='dungeon')html+=`<div class="tabs"><button data-dmode="multi" class="${dungeonMode==='multi'?'selected':''}">Mehrspieler</button><button data-dmode="solo" class="${solo?'selected':''}">Solo gegen Jael</button></div>`;
if(game==='morty')html+=`<div class="tabs"><button data-mvariant="base" class="${mortyVariant==='base'?'selected':''}">Grundspiel</button><button data-mvariant="advanced" class="${mortyVariant==='advanced'?'selected':''}">Fortgeschritten</button></div>`;
html+=`<div class="tabs">${ext[game].map((x,i)=>`<button data-xwho="${i}" class="${who===i?'selected':''}">${safe(x.name)}</button>`).join('')}<button data-xact="add" ${ext[game].length>=max?'disabled':''}>＋ Spieler</button></div>`;
html+=titleCard('Spieler',`<div class="field"><label>Spielername</label><input style="max-width:200px;text-align:left" type="text" data-xname value="${safe(p.name)}"></div>`);
if(game==='castle'){
html+=titleCard('9 Charakterkarten',`<p class="hint">Trage die nach ihren Bedingungen berechneten Punkte jeder Karte ein – einschließlich ihrer Münz- und Kombinationsboni.</p><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">${p.cards.map((c,i)=>`<label style="font-size:12px;text-align:center">Karte ${i+1}<input style="width:100%;margin-top:5px" type="number" inputmode="numeric" data-xcard="${i}" value="${Number(c)||0}"></label>`).join('')}</div>`);
html+=titleCard('Restliche Ressourcen',fld('Schlüssel','keys','1 Punkt je Schlüssel')+fld('Goldmünzen','gold','Nur für die Gleichstandsregel')+'<p class="hint">Zwielichtige Gestalten: Die besonderen Karteneffekte bitte in den jeweiligen Kartenpunkten berücksichtigen.</p>');}
if(game==='dungeon'){
if(solo){html+=titleCard('Goldvorrat & Ziel',fld('Dein Gold am Ende des 4. Jahres','myGold')+fld('Jaels Gold','jaelGold')+`<div class="field"><label>Wer erfüllt das Ziel besser?</label><select class="select" style="max-width:155px" data-xselect="goalWinner"><option value="jael" ${p.v.goalWinner!=='me'?'selected':''}>Jael / Gleichstand</option><option value="me" ${p.v.goalWinner==='me'?'selected':''}>Ich</option></select></div>`);
html+=titleCard('Deine übrigen Wertungen',fld('Aufgabe 1','task1')+fld('Aufgabe 2','task2')+fld('Aufgabe 3','task3')+fld('Positive Sterne','starsPlus')+fld('Negative Sterne','starsMinus')+fld('Bauplanpunkte','blueprint')+fld('Räume mit Eingang verbunden','pathsEntry','1 Punkt je Raum')+fld('Räume mit Ausgang verbunden','pathsExit','1 Punkt je Raum'));
html+=titleCard('Jaels Wertungen',fld('Jaels positive Sterne','jaelPlus')+fld('Jaels negative Sterne','jaelMinus')+[1,2,3,4].map(i=>fld('Jael Karte '+i+' – Grundwert','jaelBase'+i)+fld('Jael Karte '+i+' – Bonus','jaelBonus'+i)).join('')+`<p class="hint">Jaels vier Kartenboni werden nach den jeweiligen Kartenbedingungen eingetragen.</p>`);
const myGold=v(p,'myGold')>v(p,'jaelGold')?9:6,jaelGold=v(p,'jaelGold')>=v(p,'myGold')?9:6,myGoal=p.v.goalWinner==='me'?15:9,jaelGoal=p.v.goalWinner==='me'?9:15;
const mine=myGold+myGoal+v(p,'task1')+v(p,'task2')+v(p,'task3')+v(p,'starsPlus')-v(p,'starsMinus')+v(p,'blueprint')+v(p,'pathsEntry')+v(p,'pathsExit');
const jael=jaelGold+jaelGoal+v(p,'jaelPlus')-v(p,'jaelMinus')+[1,2,3,4].reduce((a,i)=>a+v(p,'jaelBase'+i)+v(p,'jaelBonus'+i),0);
html+=titleCard('Solo-Ergebnis',`<div class="row"><span>Du</span><strong class="total">${mine}</strong></div><div class="row"><span>Jael</span><strong class="total">${jael}</strong></div><div class="summary"><strong>${mine>jael?'🏆 Du gewinnst!':'Jael gewinnt (auch bei Gleichstand).'}</strong></div>`);
}else{html+=titleCard('Rangfolge & Ziel',fld('Rangfolge – Punkte','rank','9 / 6 / 3; bei 2 Personen 9 / 6')+fld('Ziel – Punkte','goal','15 / 9 / 3; bei 2 Personen 15 / 9'));
html+=titleCard('Aufgaben',fld('Aufgabe 1','task1')+fld('Aufgabe 2','task2')+fld('Aufgabe 3','task3'));
html+=titleCard('Räume & Bauplan',fld('Positive Sterne','starsPlus')+fld('Negative Sterne','starsMinus')+fld('Bauplanpunkte','blueprint')+fld('Räume mit Eingang verbunden','pathsEntry','1 Punkt je Raum')+fld('Räume mit Ausgang verbunden','pathsExit','1 Punkt je Raum'));}}
if(game==='arnak'){html+=titleCard('Forschung',fld('Lupe und Notizbuch – Punkte','research','Punkte gemäß den erreichten Feldern der verwendeten Forschungsleiste'));
html+=titleCard('Karten',fld('Gegenstände und Artefakte – Punkte','deck','Punktwerte aller Karten addieren'));
html+=titleCard('Tempelplättchen',fld('2-Punkte-Plättchen','temple2','2 Punkte je Stück')+fld('6-Punkte-Plättchen','temple6','6 Punkte je Stück')+fld('11-Punkte-Plättchen','temple11','11 Punkte je Stück'));
html+=titleCard('Wächter, Totems & Furcht',fld('Besiegte Wächter','guard','5 Punkte je Stück')+fld('Totems','idol','3 Punkte je Stück')+fld('Furchtkarten','fear','−1 Punkt je Stück'));
html+=`<div class="note">Die Expeditionsleiter: Die Forschungspunkte können für die verwendete Forschungsleiste direkt eingetragen werden.</div>`;}
if(game==='morty'){
html+=titleCard('Weitere Wertungen',fld('Vollständige Regalreihen – Punkte','shelves')+fld('Regalschilder – Punkte','signs')+fld('Übrige Kätzchen – Punkte','cats')+fld('Abzeichen – Punkte','badges'));
const names=['🍄 Wunderpilze','☁️ Gewitterwolken','👁️ Glubschaugen','🌱 Heilalraunen'];
for(let i=0;i<4;i++){let r=p.rolls[i]||'base';let h=fld('Anzahl Plättchen','q'+i,`${mortyIngredient(p,i)} Punkte`);
if(mortyVariant==='advanced'){
h+=`<div class="field"><label>Wertungsrolle</label><select class="select" style="max-width:160px" data-xroll="${i}"><option value="base" ${r==='base'?'selected':''}>Normal</option><option value="I" ${r==='I'?'selected':''}>Rolle I</option><option value="II" ${r==='II'?'selected':''}>Rolle II</option></select></div>`;
if(i===0&&r==='I')h+=fld('Größte benachbarte Pilzgruppe','mushRun','Ab 3: +10 Punkte');
if(i===0&&r==='II')h+=fld('Punkte für Pilzgruppen','mushGroupPoints','Gemäß Gruppentabelle der Rolle II');
if(i===1&&r==='I')h+=fld('Bonus für größte Wolkengruppe','cloudGroupBonus','14 oder 6 Punkte, nach Vergleich');
if(i===1&&r==='II')h+=fld('Bonus für die beste Regalreihe','cloudRowBonus','14 / 10 / 8 Punkte, nach Vergleich');
if(i===2&&r==='I')h+=fld('Plättchen mit schwarzem Deckel','blackLids','Maximal 4 zählen');
if(i===2&&r==='II')h+=fld('Plättchen mit goldenem Deckel','goldLids')+fld('Plättchen mit silbernem Deckel','silverLids');
if(i===3&&r==='I')h+=fld('Punkte nach Alraunen-Zahlen','mandrakeNumberPoints','Gemäß Zahlentabelle auf der Rolle');
if(i===3&&r==='II')h+=fld('Bonus für gleiche Zahlen','mandrakeSetBonus','4 / 12 / 32 Punkte für 2 / 3 / 4 gleiche');
}
 h+=`<div class="summary row"><span>Zutatenpunkte</span><strong>${mortyIngredient(p,i)}</strong></div>`;
 html+=titleCard(names[i],h);
}
html+=`<div class="note">Bei den Rollen mit Vergleichen zwischen Spielern oder speziellen Gruppentabellen werden nur die betreffenden Bonuspunkte manuell eingetragen. Die übrigen Punkte berechnet die App.</div>`;
}
if(!solo){html+=titleCard('Gesamtwertung',`<div class="row"><span>Gesamtpunkte</span><strong class="total">${newScore(p,game)}</strong></div>`);
html+=titleCard('🏆 Rangliste',ext[game].map(x=>({name:x.name,score:newScore(x,game),gold:v(x,'gold')})).sort((a,b)=>b.score-a.score||(game==='castle'?b.gold-a.gold:0)).map((x,i)=>`<div class="row"><span>${i+1}. ${safe(x.name)}</span><strong>${x.score} Punkte</strong></div>`).join(''));}
html+=`<button class="danger" data-xact="reset">↻ Neues Spiel starten</button><p class="notice">Die Eingaben werden lokal in Safari gespeichert. Beim Löschen von Websitedaten können sie verloren gehen.</p>`;
app.innerHTML=html;
}
const oldRender=render;
render=function(){if(extGames.includes(game))return extRender();return oldRender()};
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.game&&extGames.includes(b.dataset.game)){e.stopImmediatePropagation();game=b.dataset.game;who=0;dungeonMode='multi';mortyVariant='base';render();return;}
if(!extGames.includes(game))return;
if(b.dataset.xact||b.dataset.xwho!==undefined||b.dataset.dmode||b.dataset.mvariant){e.stopImmediatePropagation();
if(b.dataset.xact==='home'){game='home';render();return;}
if(b.dataset.xwho!==undefined)who=+b.dataset.xwho;
if(b.dataset.dmode)dungeonMode=b.dataset.dmode;
if(b.dataset.mvariant){mortyVariant=b.dataset.mvariant;ext[game].forEach(x=>x.variant=mortyVariant);persistExt();}
if(b.dataset.xact==='add'){ext[game].push(defNew(game,`Spieler ${ext[game].length+1}`));ext[game].forEach(x=>x.variant=mortyVariant);who=ext[game].length-1;persistExt();}
if(b.dataset.xact==='reset'&&confirm('Wirklich alle Eingaben dieses Spiels zurücksetzen?')){ext[game]=[defNew(game,'Spieler 1'),defNew(game,'Spieler 2')];who=0;persistExt();}
render();}},true);
app.addEventListener('change',e=>{if(!extGames.includes(game))return;const el=e.target,p=ep();
if(el.dataset.extfield){p.v[el.dataset.extfield]=Number(el.value)||0;if(!['starsMinus','jaelMinus'].includes(el.dataset.extfield))p.v[el.dataset.extfield]=Math.max(0,p.v[el.dataset.extfield]);}
else if(el.dataset.xcard!==undefined)p.cards[+el.dataset.xcard]=Number(el.value)||0;
else if(el.dataset.xroll!==undefined)p.rolls[+el.dataset.xroll]=el.value;
else if(el.dataset.xselect)p.v[el.dataset.xselect]=el.value;
else if(el.dataset.xname!==undefined)p.name=el.value.trim()||`Spieler ${who+1}`;
else return;
e.stopImmediatePropagation();persistExt();render();},true);

try{render()}catch(err){document.getElementById("app").innerHTML="<div class=card><h2>Startfehler</h2><p>"+String(err.message)+"</p></div>";}</script></body></html>
